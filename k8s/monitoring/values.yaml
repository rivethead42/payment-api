# kube-prometheus-stack Helm values for AWS EKS (monitoring namespace).
# Chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
#
# Replace every [PLACEHOLDER] before helm install.

fullnameOverride: ""

# ---------------------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------------------
grafana:
  enabled: true

  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Prometheus is provisioned as the default datasource by the chart sidecar.
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folder: /tmp/dashboards

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster-overview:
        gnetId: 315
        revision: 3
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus

  persistence:
    enabled: true
    type: pvc
    storageClassName: gp2
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  service:
    type: LoadBalancer
    port: 80
    # AWS LB annotations (uncomment as needed):
    #   service.beta.kubernetes.io/aws-load-balancer-type: "external"
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    # Classic ELB: service.beta.kubernetes.io/aws-load-balancer-type: "elb"
    annotations: {}
    loadBalancerSourceRanges: []

  serviceAccount:
    create: true
    autoMount: true

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  enabled: true

  serviceAccount:
    create: true
    name: prometheus-monitoring
    annotations: {}

  service:
    enabled: true
    type: LoadBalancer
    port: 9090
    # AWS LB annotations (uncomment as needed):
    #   service.beta.kubernetes.io/aws-load-balancer-type: "external"
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    annotations: {}
    loadBalancerSourceRanges: []

  prometheusSpec:
    replicas: 1

    retention: 15d

    externalLabels:
      cluster: "demo-eks-cluster"

    serviceAccountName: prometheus-monitoring

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    # Discover PodMonitors/ServiceMonitors created outside this Helm release
    # (e.g. application teams deploying their own monitors).
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

    # Pod-annotation-based scrape discovery (prometheus.io/* annotations).
    # The Prometheus Operator uses ServiceMonitor/PodMonitor CRDs by default;
    # this job preserves legacy annotation-based discovery for application pods.
    additionalScrapeConfigs:
      - job_name: kubernetes-pods-annotated
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      - job_name: kubernetes-services-annotated
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_service_name

# ---------------------------------------------------------------------------
# Built-in component scrapers (enabled by default; explicit for clarity)
# ---------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true

coreDns:
  enabled: true

kubeDns:
  enabled: false

# ---------------------------------------------------------------------------
# Subchart tuning
# ---------------------------------------------------------------------------
kube-state-metrics:
  releaseLabel: true

prometheus-node-exporter:
  releaseLabel: true

# ---------------------------------------------------------------------------
# Prometheus Operator (manages Prometheus CR, ServiceMonitors, RBAC)
# ---------------------------------------------------------------------------
prometheusOperator:
  enabled: true
  serviceAccount:
    create: true
