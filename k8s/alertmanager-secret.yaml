# Slack credentials for Alertmanager payment-api routing.
# Replace [PLACEHOLDER] values before applying:
#   echo -n 'https://hooks.slack.com/services/T.../B.../...' | base64
#   echo -n 'xapp-1-...' | base64
#
# NOTE: Alertmanager Slack receivers use the webhook URL. The bot token is stored
# for future Slack App integrations (interactive buttons, thread replies) and is
# not referenced by the Alertmanager config below.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/component: payment-api-alerts
type: Opaque
data:
  slack-webhook-url: W1BMQUNFI0hPTERFUl0=
  slack-bot-token: W1BMQUNFI0hPTERFUl0=
